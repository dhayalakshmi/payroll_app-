apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payroll-app
  template:
    metadata:
      labels:
        app: payroll-app
    spec:
      containers:
        - name: payroll-app
          image: dhayalakshmi04/payroll-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: payroll-service
spec:
  type: NodePort
  selector:
    app: payroll-app
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30008
