apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-auth-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payroll-auth-app
  template:
    metadata:
      labels:
        app: payroll-auth-app
    spec:
      containers:
        - name: payroll-auth-app
          image: dhayalakshmi04/payroll-auth-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: payroll-auth-service
spec:
  type: NodePort
  selector:
    app: payroll-auth-app
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30009
